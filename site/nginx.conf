# /etc/nginx/sites-available/maxwellii
# 启用：sudo ln -sf /etc/nginx/sites-available/maxwellii /etc/nginx/sites-enabled/maxwellii
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name maxwellii.com www.maxwellii.com;
    return 301 https://maxwellii.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name maxwellii.com www.maxwellii.com;

    # 与 naming.maxwellii.com / tale.maxwellii.com 共用同一对证书
    ssl_certificate     /etc/nginx/ssl/maxwellii.com.pem;
    ssl_certificate_key /etc/nginx/ssl/maxwellii.com.key;

    add_header Strict-Transport-Security "max-age=63072000" always;

    root /home/admin/maxwellii-site;
    index index.html;

    # 历史 URL redirect（项目改名 / 合并兜底，外链不会 404）
    location = /p/ai-knowleage.html              { return 301 /p/ai-knowledge.html; }
    location = /p/openclaw-customize-skills.html { return 301 /p/openclaw.html; }
    location = /p/ifind-agent.html               { return 301 /p/claude-financial-research.html; }
    location = /p/xhs-5agent-pipeline.html       { return 301 /p/xhs-agency.html; }

    # /api/chat — chat-api LLM 化身后端（SSE 流式，禁 buffer，长连接）
    location /api/chat {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE 不能 buffer
        proxy_cache off;
        proxy_read_timeout 300s;      # 长连接（流式回复可能 > 30s）
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # /admin/* — 反代到 chat-api（私有日志查看页，需 ?token= 鉴权）
    # ^~ 提高优先级，避免被 SPA fallback / 静态资源 regex 拦走
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /_next/* — Next.js 构建产物（admin 页面需要）
    # ^~ 同样防止被下面 css/js regex 拦走
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # _next/static 内容带 hash，可放心长缓存
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback（如果是单页应用，未匹配的路径回到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 图片 / 字体 — 30 天 immutable（极少变）
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # CSS / JS — 必校验（每次过来对 ETag，未变 304 省流量，改了立即生效）
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # gzip 压缩文本类资源
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;
}
