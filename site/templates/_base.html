<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{name_zh}} — ~/iyuenan3/p</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css?v=20260509e">
</head>
<body>

<div class="window">

  <div class="titlebar">
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="path">~/iyuenan3/p/{{slug}} — bash — 100×40</div>
    <div class="meta">tmux 0:project*</div>
  </div>

  <div class="body">

    <div class="back-link" data-reveal>
      <span class="sigil">$</span> <a class="cd-link" href="../"><span class="cmd">cd</span> <span class="arg">..</span></a> <span class="comment"># 返回 ~/iyuenan3</span>
    </div>

    <div class="page-header" data-reveal>
      <div class="page-prompt">
        <span class="sigil">$</span> <span class="cmd">cat</span> <span class="arg">{{slug}}/README.md</span>
      </div>
      <h1 class="page-title-zh">{{name_zh}}</h1>
      <h1 class="page-title-en">{{name_en}}</h1>
      <div class="page-meta">
        <span class="page-status status-{{status}}">{{status_label}}</span>
        <span class="dim">since {{since}}</span>
      </div>
    </div>

{{blocks}}

    <div class="signoff" data-reveal>
      <div class="lines">
        <div class="echo">$ <span class="amber">echo</span> "# end of {{slug}}.md"<span class="cursor"></span></div>
        <div class="end"># <a href="../">back to ~/iyuenan3</a></div>
      </div>
    </div>

  </div>
</div>

<!-- 详情页初始化（CSP 兼容：从 inline 提取） -->
<script src="../detail-init.js?v=20260510c"></script>

</body>
</html>
